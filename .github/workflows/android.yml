name: Android Build & CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-check:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

  build-android:
    name: Build Android APKs (Hermes Enabled)
    needs: lint-and-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create Metro assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Bundle React Native JS (Metro bundler → index.android.bundle)
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache

      - name: Compile JS Bundle to Hermes Bytecode (HBC Binary Format)
        run: |
          HERMESC_BIN=$(find node_modules -name "hermesc" -type f \( -name "hermesc" -o -name "hermesc.exe" \) | head -n 1)
          if [ -n "$HERMESC_BIN" ]; then
            chmod +x "$HERMESC_BIN"
            echo "Found hermesc at: $HERMESC_BIN"
            "$HERMESC_BIN" -emit-binary -out android/app/src/main/assets/index.android.bundle.hbc android/app/src/main/assets/index.android.bundle
            mv android/app/src/main/assets/index.android.bundle.hbc android/app/src/main/assets/index.android.bundle
            echo "Successfully converted index.android.bundle from minified JS text into Hermes Bytecode (HBC binary)!"
            file android/app/src/main/assets/index.android.bundle || true
          else
            echo "hermesc binary not found in node_modules"
          fi

      - name: Setup Gradle Wrapper
        run: |
          cd android
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.3
          fi
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Summary Report
        run: |
          echo "### 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle:** index.android.bundle via Metro" >> $GITHUB_STEP_SUMMARY
          echo "- **JS Engine:** Hermes (native)" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** ReactActivity + ReactNativeHost (no WebView)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts:** Debug & Release APKs" >> $GITHUB_STEP_SUMMARY
